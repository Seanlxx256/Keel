[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-runtime"
version = "0.2.0"
description = "Evidence-driven coding task runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
include = ["keel*"]
