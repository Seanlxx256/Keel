[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-runtime"
version = "0.3.0"
description = "Evidence-driven coding task runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
compass = ["tree-sitter>=0.25,<0.27", "tree-sitter-python>=0.23,<0.26"]
compass-vectors = ["lancedb>=0.20,<1"]

[project.scripts]
keel = "keel.cli:main"
compass = "compass.cli:main"

[tool.setuptools.packages.find]
include = ["keel*", "compass*"]
