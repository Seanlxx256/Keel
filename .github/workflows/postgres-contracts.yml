name: PostgreSQL operation contracts

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Disposable local CI fixture credential, never a deployment secret.
          POSTGRES_PASSWORD: keel-ci-only
          POSTGRES_DB: keel_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keel_contracts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEEL_TEST_POSTGRES_DSN: postgresql://postgres:keel-ci-only@localhost:5432/keel_contracts
      KEEL_TEST_POSTGRES_ALLOW_SCHEMA: "yes"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install optional PostgreSQL driver
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --retries 0 --timeout 30 -e ".[postgres]"
      - name: Read-only connection preflight
        timeout-minutes: 1
        run: python examples/check_postgres_connection.py --dsn-env KEEL_TEST_POSTGRES_DSN --output .keel/postgres-ci/preflight
      - name: Freeze declared test inputs
        timeout-minutes: 1
        shell: python
        run: |
          import hashlib, os, sys
          from pathlib import Path
          import psycopg
          from compass.progress import atomic_json
          from keel.evaluation_protocol import implementation_hashes
          root=Path.cwd(); output=root/'.keel/postgres-ci'; output.mkdir(parents=True,exist_ok=True)
          modules=['tests.test_postgres_store','tests.test_postgres_integration']
          files=[root/(name.replace('.','/')+'.py') for name in modules]
          files.append(root/'.github/workflows/postgres-contracts.yml')
          plan={'root':str(root),'output':str(output/'results'),'python':sys.executable,
                'arguments':[str(root/'examples/run_local_regression.py'),'--plan',str(output/'plan.json')],
                'max_seconds':120,'implementation':implementation_hashes(root),
                'input_hashes':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},'modules':modules}
          atomic_json(output/'plan.json',plan)
          atomic_json(output/'identity.json',{'commit':os.getenv('GITHUB_SHA'),'psycopg_version':psycopg.__version__,
              'scope':'Disposable PostgreSQL operation contract service; not full controller migration'})
      - name: Run bounded native database contracts
        timeout-minutes: 3
        run: python examples/run_bounded_exploration.py --plan .keel/postgres-ci/plan.json
      - name: Reject unavailable or skipped database tests
        timeout-minutes: 1
        run: python examples/verify_postgres_contracts.py --output .keel/postgres-ci
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-operation-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .keel/postgres-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
